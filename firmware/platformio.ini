; ESP32-S3 WiFi Radar —— PlatformIO 工程
; 用 VSCode 打开本 firmware 文件夹 -> 点底部 ✔ Build，再点 → Upload，上传后按板子上的 RESET(RST/EN) 键即开始运行。
;
; env:esp32s3        适用于接 "UART/COM" 口(CH340/CP2102) 的开发板，最常见
; env:esp32s3_usbcdc 适用于接 "USB" 原生口(板子上标 USB) 的开发板
; 如果上传失败：按住 BOOT 键不放，再按一下 RESET，松开 BOOT，然后重新 Upload。

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3]

[env:esp32s3_usbcdc]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
