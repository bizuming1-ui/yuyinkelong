; ESP32-S3 WiFi Radar v4 —— PlatformIO 工程
; 用 VSCode 打开本 firmware 文件夹 -> 点底部 ✔ Build，再点 → Upload，上传后按板子上的 RESET(RST/EN) 键即开始运行。
;
; 默认环境 esp32s3（推荐）：固件会【同时】往两个口输出数据
;   - 板子上标 "USB"  的原生口 (USB-Serial/JTAG)  -> 网页 USB 直连 / PlatformIO 串口监视器 都能收到
;   - 板子上标 "UART"/"COM" 的口 (CH340/CP2102)   -> 同样能收到
;   所以插哪个口都行，不会再出现"网页已连接 USB 却一直 0 帧"。
; env:esp32s3_uart 仅在你的板子只有 UART 口、且上面的默认环境异常时使用（只从 UART0 输出）。
; env:esp32s3_n16r8 适用于 N16R8 / N8R8（8线 PSRAM）板子，默认环境已能正常运行，一般不需要。
;
; 如果上传失败：按住 BOOT 键不放，再按一下 RESET，松开 BOOT，然后重新 Upload。
; 上传成功后：按一下 RESET 键（或重新插拔 USB）即开始运行。

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 重要：串口监视器不要拉 DTR/RTS，否则会把板子一直按在复位/下载模式
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
monitor_filters = default, time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_uart]
; 不开 USB CDC：Serial 就是 UART0

[env:esp32s3_n16r8]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env:esp32s3.build_flags}
