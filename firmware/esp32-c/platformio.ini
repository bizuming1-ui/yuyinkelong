; ============================================================================
;  三 ESP32-S3 N16R8 · WiFi CSI 感知 · PlatformIO 工程（ESP32-A / ESP32-B / ESP32-C 共用本文件）
;  用法：新建一个 PlatformIO 文件夹，把本目录下 4 个文件覆盖进去（platformio.ini / upload_retry.py / include/config.h / src/main.cpp）
;       三块板各建一个工程；只需要改 include/config.h 里的 NODE_ROLE（A/B/C）和 WiFi 名称/密码。
;
;  ★ 烧录稳定性说明（沿用 v3 的修复，已针对 "Cannot configure port ... OSError(22)" 与板型识别错误）：
;   1) 板型必须是 N16R8：16MB Flash + 8MB OPI PSRAM (qio_opi) + default_16MB 分区（env n16r8）。
;   2) 烧录到 50% 时串口"消失"= Windows 上 USB 设备中途掉线/重新枚举：固件不占用原生 USB（ARDUINO_USB_CDC_ON_BOOT=0），
;      默认烧录速度 230400；仍失败请选 [env:n16r8_slow]；再不行：按住 BOOT → 点一下 RST → 松开 BOOT，再点 Upload。
;   3) 两个 USB 口：优先使用标有 "UART"/"COM" 的那个口；换短数据线、直插主板 USB 口（不要接 HUB）；关闭串口监视器。
; ============================================================================
[platformio]
default_envs = n16r8

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
; 烧录防掉线：upload_retry.py（和本文件同目录）会自动降速重试 + 等待 COM 口恢复
extra_scripts = post:upload_retry.py
build_unflags =
    -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------- 默认：N16R8（16MB Flash + 8MB 八线 PSRAM） ----------------
[env:n16r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 230400

; ---------------- 烧录慢速保底：115200，最稳 ----------------
[env:n16r8_slow]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 115200

; ---------------- 诊断用：不启用 PSRAM（如果开机循环重启 "PSRAM ID read error" 就用它） ----------------
[env:n16r8_nopsram]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 115200
