; ESP32-S3 双节点 WiFi CSI 雷达 —— Node A（发起端）PlatformIO 工程
; 用法：VSCode → PlatformIO → New Project（Board: Espressif ESP32-S3-DevKitC-1, Framework: Arduino）
;       把本文件、include/config.h、include/radar_common.h、src/main.cpp 覆盖进去 → Build → Upload。
;       上传失败：按住 BOOT，按一下 RESET，松开 BOOT，再 Upload。上传成功后按 RESET 即运行。
; 固件同时往“USB 原生口”和“UART/COM 口”输出日志，插哪个口都能在串口监视器看到。
; 这块板子只要接 5V 供电即可（充电头/充电宝都行），数据靠 WiFi 传给 Kaggle，不用连电脑。
; 另一块 ESP32 请用 firmware/node_b 的同名 4 个文件。

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
monitor_filters = default, time
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 只有 UART 口的板子 / 默认环境异常时使用
[env:esp32s3_uart]

; N16R8 / N8R8（八线 PSRAM）板子的可选环境；本固件不使用 PSRAM，默认环境即可正常运行
[env:esp32s3_n16r8]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env:esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
