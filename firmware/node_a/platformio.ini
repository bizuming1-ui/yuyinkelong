; ESP32-S3 dual-node WiFi CSI radar - Node A (initiator) PlatformIO project (v9.1)
; Usage: VSCode -> PlatformIO -> New Project (Board: Espressif ESP32-S3-DevKitC-1, Framework: Arduino)
;        overwrite platformio.ini, include/config.h, include/radar_common.h, src/main.cpp with these 4 files
;        -> Build -> Upload. Other board: use the SAME 4 files from firmware/node_b.
; Upload failed? Hold BOOT, tap RESET, release BOOT, then Upload again. After upload press RESET.
; Board only needs 5V power after upload (phone charger / power bank): data goes over WiFi to Kaggle.
;
; BUILD FAILED? Try in this order:
;  0) Errors point INTO ...\.platformio\packages\framework-arduinoespressif32\libraries\WiFiClientSecure\src\WiFiClientSecure.h
;     (hundreds of "'WiFiClientSecure' was not declared in this scope")? That framework file was overwritten by
;     pasted code (usually radar_common.h pasted into the header you opened by clicking #include).
;     FIX: close VSCode, delete folder %USERPROFILE%\.platformio\packages\framework-arduinoespressif32 , reopen, Build
;     (it re-downloads automatically). Or run firmware/tools/fix_platformio.ps1 . Never paste code into framework headers.
;  1) Project folder path must be pure ASCII (no Chinese / spaces), e.g. D:\esp\node_a
;  2) PlatformIO Home -> Platforms -> Update; or delete the project's .pio folder and Build again
;  3) Download stuck (network)? Use a proxy/VPN for GitHub, or pick the env below
;  4) Switch environment (bottom status bar of VSCode, or: pio run -e esp32s3_core3):
;       esp32s3        = Arduino core 2.0.17 (espressif32@6.9.0)  <- default, tested
;       esp32s3_core3  = Arduino core 3.x (pioarduino)            <- tested, use if your PlatformIO forces core 3
; The source code compiles on BOTH Arduino core 2.x and 3.x.

[platformio]
default_envs = esp32s3

[env]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
monitor_filters = default, time
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
platform = espressif32@6.9.0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Arduino core 3.x (pioarduino). Same source code.
[env:esp32s3_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
build_flags =
    ${env:esp32s3.build_flags}

; Boards with only a UART/COM port (no native USB): USB CDC is off, Serial = UART0
[env:esp32s3_uart]
platform = espressif32@6.9.0

; N16R8 / N8R8 boards (octal PSRAM). Firmware does not use PSRAM; default env also runs fine.
[env:esp32s3_n16r8]
platform = espressif32@6.9.0
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env:esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
