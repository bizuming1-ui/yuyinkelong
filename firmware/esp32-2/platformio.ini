; ============================================================================
;  ESP32-S3 N16R8 · WiFi CSI 双节点雷达 · PlatformIO 工程（ESP32-1 / ESP32-2 共用本文件）
;  用法：新建一个 PlatformIO 文件夹，把本目录下 3 个文件覆盖进去（platformio.ini / include/config.h / src/main.cpp）
;       只需要改 include/config.h 里的 NODE_ID（1 或 2）和 WiFi 名称/密码。
;
;  ★ v2.1 烧录修复（针对 "Cannot configure port ... OSError(22, 指定不存在的设备)" 与随后的
;    "Please specify `upload_port`"）：
;   【真实原因】烧录写到 60% 左右时 Windows 上的 COM 口"突然消失" = USB 设备掉线/重新枚举
;               （数据线差/供电不足/接在 Type-C 口或 HUB 上/CH343·CP210x 驱动异常/省电挂起）。
;               esptool 之后再去配置串口就报 OSError(22)。第二个报错只是因为板子已掉线，找不到端口。
;   【软件侧已做的加固】
;   1) 默认烧录波特率 115200（以前 230400）；原生 USB 口不受波特率影响，UART 桥接芯片(CH343/CP210x)在低速下最稳。
;   2) 新增 [env:n16r8_safe]：upload_flags = --no-stub（用芯片 ROM 里的下载器，不上传 stub、不切换波特率）。
;      「Changing baud rate」那一步正是 Windows 上 pySerial 重配串口、最容易触发 OSError(22) 的时刻；
;      ROM 模式全程保持 115200，不会重配串口。仍失败 → [env:n16r8_slow]（57600 + 15 次连接重试）。
;   3) 固件 ARDUINO_USB_CDC_ON_BOOT=1：原生 USB 口在程序运行时依然是一个 COM 口，
;      以后每次 Upload 都能自动识别端口、自动复位进下载模式；日志同时输出到 USB 口和 UART 口，两个口都能看。
;   4) 板型：N16R8 = 16MB Flash + 8MB 八线 PSRAM，已设 qio_opi + default_16MB.csv。
;      （PlatformIO 横幅仍显示 "DevKitC-1-N8 (8MB QD, No PSRAM)" 是板卡库的固定名称，不影响实际配置。）
;   【硬件侧（最关键，成功率最高）】
;   a) 优先用标 UART / COM 的 USB 口；换一根确定能传数据的短线；直插主板后置 USB-A 口，不要 HUB、不要笔记本 Type-C 转接。
;   b) 关闭串口监视器 / 串口助手 / Arduino IDE / 其它占用串口的软件。
;   c) 手动进入下载模式：按住 BOOT 不放 → 点一下 RST → 松开 BOOT，再点 Upload；
;      此时设备管理器里会出现一个新的 COM 口，把它写到下面的 upload_port（去掉行首分号）。
;   d) 设备管理器 → 通用串行总线控制器 → USB 根集线器 → 电源管理：取消"允许计算机关闭此设备以节约电源"。
;   e) CH340/CH343 驱动版本过新会出这个错：卸载后装旧版驱动（官网 CH341SER 2023 以前版本）。
; ============================================================================
[platformio]
default_envs = n16r8

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; upload_port = COM18        ; ← 烧录时自动识别失败，就取消注释并改成设备管理器里看到的 COM 口
; monitor_port = COM18
lib_deps =
    knolleary/PubSubClient@^2.8
build_unflags =
    -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- 默认：N16R8（16MB Flash + 8MB 八线 PSRAM），115200 稳定烧录 ----------------
[env:n16r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 115200

; ---------------- 烧录保底 1：ROM 下载器 --no-stub（不上传 stub、不切换波特率，上一个失败后首选） ----------------
[env:n16r8_safe]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 115200
upload_flags = --no-stub

; ---------------- 烧录保底 2：57600 低速 + 15 次连接重试 ----------------
[env:n16r8_slow]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 57600
upload_flags = --connect-attempts=15

; ---------------- 一切正常后想加速：460800 ----------------
[env:n16r8_fast]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 460800

; ---------------- 诊断用：不启用 PSRAM（如果开机循环重启 "PSRAM ID read error" 就用它） ----------------
[env:n16r8_nopsram]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 115200
upload_flags = --no-stub
