; ============================================================================
;  ESP32-S3 N16R8 · WiFi CSI 双节点雷达 · PlatformIO 工程（ESP32-1 / ESP32-2 共用本文件）
;  用法：新建一个 PlatformIO 文件夹，把本目录下 4 个文件覆盖进去（platformio.ini / upload_retry.py / include/config.h / src/main.cpp）
;       只需要改 include/config.h 里的 NODE_ID（1 或 2）和 WiFi 名称/密码。
;
;  ★ 修复说明（针对你日志里的 "Cannot configure port ... OSError(22)" 与板型识别错误）：
;   1) 日志显示板型被识别为 "DevKitC-1-N8 (8MB QD, No PSRAM)"：说明 8MB 的 PSRAM 根本没开，
;      Flash 也只按 8MB 分区(6.25MB)。本文件已改成 N16R8：16MB Flash + 8MB OPI PSRAM (qio_opi) + default_16MB 分区。
;   2) 烧录到 50% 时串口"消失"= Windows 上 USB 设备在烧录中途掉线/重新枚举。三重加固：
;      - 固件不再占用原生 USB（ARDUINO_USB_CDC_ON_BOOT=0），烧录期间 USB 口不会被应用程序重置；
;      - 默认烧录速度降到 230400（比 460800/921600 稳得多），仍失败请选 [env:n16r8_slow]；
;      - 仍不行：按住板子 BOOT 键不放 → 点一下 RST → 松开 BOOT（进入下载模式），再点 Upload。
;   3) 两个 USB 口：优先使用标有 "UART"/"COM" 的那个口（CH343/CP2102 桥接芯片，最稳）；
;      换短的数据线、直插电脑主板 USB 口（不要接 HUB）；关闭串口监视器/串口助手/Arduino IDE。
; ============================================================================
[platformio]
default_envs = n16r8

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
; 烧录防掉线：upload_retry.py（和本文件同目录）会自动降速重试 + 等待 COM 口恢复
extra_scripts = post:upload_retry.py
build_unflags =
    -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------- 默认：N16R8（16MB Flash + 8MB 八线 PSRAM） ----------------
[env:n16r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 230400

; ---------------- 烧录慢速保底：115200，最稳 ----------------
[env:n16r8_slow]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
upload_speed = 115200

; ---------------- 诊断用：不启用 PSRAM（如果开机循环重启 "PSRAM ID read error" 就用它） ----------------
[env:n16r8_nopsram]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 115200
